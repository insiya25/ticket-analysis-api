<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Sphere gradient fill -->
    <circle cx="50" cy="50" r="45" fill="url(#globeGrad)" />
    
    <!-- Grid lines (longitude/latitude) -->
    <path d="M50 5 A45 45 0 0 0 50 95" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    <path d="M50 5 A22 45 0 0 0 50 95" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    <path d="M50 5 A22 45 0 0 1 50 95" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    <path d="M5 50 A45 45 0 0 0 95 50" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    <path d="M10 27 Q50 36 90 27" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    <path d="M10 73 Q50 64 90 73" stroke="rgba(0,0,0,0.55)" stroke-width="3.5" fill="none" />
    
    <!-- Arrow pointing up-right -->
    <path d="M30 70 L70 30" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M48 30 H70 V52" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <defs>
        <linearGradient id="globeGrad" x1="5" y1="5" x2="95" y2="95" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f5b042" />
            <stop offset="1" stop-color="#d97706" />
        </linearGradient>
    </defs>
</svg>
